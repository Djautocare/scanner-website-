<!DOCTYPE html>
<html lang="en">
<head><script src="/js/security-session.js?v=1"></script><script src="/js/security-events.js?v=1"></script>
<meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d0d0d">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Search Stock</title>


<style>
html{
    touch-action: manipulation;
}

*{
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:
        radial-gradient(circle at top left, rgba(0,123,255,0.14), transparent 35%),
        radial-gradient(circle at top right, rgba(40,167,69,0.10), transparent 35%),
        #0d0d0d;
    color:white;
    padding:18px;
    margin:0;
    overflow-x:hidden;
}

.page{
    max-width:850px;
    margin:0 auto;
}

.panel{
    background:linear-gradient(180deg, #1d1d1d, #151515);
    border:1px solid rgba(255,255,255,0.08);
    padding:24px;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
}

h1{
    text-align:center;
    font-size:34px;
    margin:12px 0 6px 0;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin:0 0 24px 0;
    font-size:15px;
}

.form-card{
    background:linear-gradient(145deg, #242424, #191919);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:18px;
    margin-bottom:16px;
}

.input-label{
    text-align:left;
    color:#ddd;
    font-weight:bold;
    margin:14px 0 6px 2px;
    font-size:14px;
}

input,
select,
button,
textarea{
    width:100%;
    padding:14px;
    margin:6px 0 12px 0;
    border:none;
    border-radius:12px;
    font-size:16px;
}

input,
select,
textarea{
    background:#2a2a2a;
    color:white;
    outline:none;
    border:1px solid rgba(255,255,255,0.08);
}

button{
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.button-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:12px 0;
}

.search-button{
    background:linear-gradient(135deg, #007bff, #0056b3);
    border:1px solid rgba(0,123,255,0.45);
    box-shadow:0 10px 30px rgba(0,123,255,0.16);
}

.scan-button{
    background:linear-gradient(135deg, #0275d8, #025aa5);
}

.stop-button{
    background:linear-gradient(135deg, #dc3545, #a92735);
}

.torch-button{
    background:linear-gradient(135deg, #ffc107, #d39e00);
    color:black;
}

.choice-button{
    background:linear-gradient(145deg, #242424, #191919);
    text-align:left;
    border:1px solid rgba(255,255,255,0.08);
    margin:8px 0;
}

.choice-button small{
    color:#bbb;
}

.quick-sale-button{
    background:linear-gradient(135deg, #dc3545, #a92735);
    border:1px solid rgba(220,53,69,0.45);
}

.location-sale-button{
    background:linear-gradient(135deg, #0275d8, #025aa5);
    width:100%;
    margin:10px 0 0 0;
}

.back-button{
    background:linear-gradient(135deg, #333, #222);
    border:1px solid rgba(255,255,255,0.10);
}

.result-card{
    background:linear-gradient(145deg, #242424, #191919);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:18px;
    margin:18px 0;
    text-align:left;
}

.result-header{
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:flex-start;
    margin-bottom:12px;
}

.result-title{
    font-size:22px;
    font-weight:bold;
    margin:0;
}

.badge{
    background:rgba(0,123,255,0.18);
    border:1px solid rgba(0,123,255,0.35);
    color:#66b2ff;
    padding:7px 10px;
    border-radius:999px;
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
}

.info-row{
    background:#111;
    padding:10px;
    border-radius:10px;
    margin:8px 0;
    border:1px solid rgba(255,255,255,0.06);
}

.location{
    background:#111;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
    border:1px solid rgba(255,255,255,0.06);
}

.location-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    font-weight:bold;
}

#scannerWrap{
    position:relative;
    max-width:380px;
    width:100%;
    margin:20px auto;
    display:none;
    background:#000;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.12);
    overflow:hidden;
    box-shadow:0 12px 35px rgba(0,0,0,0.35);
}

#reader{
    width:100%;
    min-height:280px;
    background:#000;
    display:block;
    object-fit:cover;
}

.scan-overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        linear-gradient(to bottom,
            rgba(0,0,0,0.58) 0%,
            rgba(0,0,0,0.58) 31%,
            rgba(0,0,0,0.08) 31%,
            rgba(0,0,0,0.08) 69%,
            rgba(0,0,0,0.58) 69%,
            rgba(0,0,0,0.58) 100%);
}

.scan-box{
    width:86%;
    height:110px;
    border:3px solid #00e676;
    border-radius:16px;
    position:relative;
    box-shadow:0 0 28px rgba(0,230,118,0.50);
}

.scan-line{
    position:absolute;
    left:9%;
    right:9%;
    top:50%;
    height:3px;
    background:#ff3333;
    border-radius:999px;
    transform:translateY(-50%);
    box-shadow:0 0 16px rgba(255,51,51,0.85);
}

.scan-help{
    position:absolute;
    left:12px;
    right:12px;
    bottom:12px;
    text-align:center;
    font-size:13px;
    color:white;
    background:rgba(0,0,0,0.55);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:999px;
    padding:8px 10px;
}

.camera-tools{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:0 0 12px 0;
}

.refocus-button{
    background:linear-gradient(135deg, #28a745, #1f8b3a);
    border:1px solid rgba(40,167,69,0.45);
}

.zoom-button{
    background:linear-gradient(135deg, #6f42c1, #4c2a8a);
    border:1px solid rgba(111,66,193,0.45);
}

#results{
    margin-top:16px;
}

.links-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
    margin-top:16px;
}

.link-card{
    display:block;
    text-decoration:none;
    color:white;
    background:linear-gradient(135deg, rgba(0,123,255,0.28), rgba(0,123,255,0.08));
    border:1px solid rgba(0,123,255,0.35);
    padding:14px;
    border-radius:14px;
    font-weight:bold;
    text-align:center;
}

.live-results{
    margin-top:10px;
}

.live-result-button{
    background:linear-gradient(145deg, #242424, #191919);
    text-align:left;
    border:1px solid rgba(0,123,255,0.24);
    margin:8px 0;
}

.selected-bundle-box{
    background:#111;
    border:1px solid rgba(40,167,69,0.28);
    border-radius:14px;
    padding:12px;
    margin:12px 0;
}

.selected-bundle-title{
    font-weight:bold;
    color:#7CFF9B;
    margin-bottom:8px;
}

.selected-bundle-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    background:#1d1d1d;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    padding:10px;
    margin:8px 0;
}

.selected-bundle-item span{
    font-size:14px;
}

.remove-selected-button{
    width:auto;
    padding:8px 10px;
    margin:0;
    border-radius:10px;
    background:linear-gradient(135deg, #dc3545, #a92735);
    font-size:13px;
}

.clear-bundle-button{
    background:linear-gradient(135deg, #555, #333);
    border:1px solid rgba(255,255,255,0.10);
}

.helper-text{
    color:#aaa;
    font-size:13px;
    margin:4px 0 10px 0;
    line-height:1.35;
}

.box-group-card{
    background:linear-gradient(145deg, #242424, #191919);
    border:1px solid rgba(40,167,69,0.24);
    border-radius:16px;
    padding:18px;
    margin:18px 0;
    text-align:left;
}

.box-group-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:bold;
    color:#7CFF9B;
    margin-bottom:12px;
}

.box-group-line{
    background:#111;
    border:1px solid rgba(255,255,255,0.06);
    border-radius:12px;
    padding:12px;
    margin:8px 0;
}

.box-group-line small{
    color:#bbb;
}

/* Loading overlay */
#loadingOverlay{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    z-index:9999;
    justify-content:center;
    align-items:center;
}

.loaderBox{
    text-align:center;
    color:white;
    font-weight:bold;
}

.spinner{
    width:55px;
    height:55px;
    border:6px solid #333;
    border-top:6px solid #4CAF50;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 15px auto;
}

@keyframes spin{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}

@media(max-width:600px){
    h1{
        font-size:30px;
    }

    .panel{
        padding:18px;
    }

    .button-grid{
        grid-template-columns:1fr;
    }

    .camera-tools{
        grid-template-columns:1fr;
    }

    .result-header{
        flex-direction:column;
    }
}
</style>
<link rel="stylesheet" href="css/theme.css?v=contrast-1">
<link rel="stylesheet" href="css/inventoryTopbar.css">

<link rel="stylesheet" href="css/appShell.css?v=1">
</head>

<body>

<div class="page">

<div class="panel">

<div id="inventory-topbar"></div>

<h1>Search Stock</h1>
<p class="subtitle">Find active stock, check quantities and see exactly where each item is stored</p>

<div class="form-card">

<div class="input-label">Search or Barcode</div>
<input type="text" id="query" placeholder="Type an item name or barcode">
<p class="helper-text">Only items with active stock are shown. Type an item name or barcode, then press Search or Enter.</p>
<div id="selectedBundleItems"></div>
<div id="liveResults" class="live-results"></div>

<button class="search-button" data-ios-click="hfbb3551acd57559e">Search</button>

</div>

<div id="results"></div>

<div class="links-grid">
    <a class="link-card" href="index.html">← Back to Dashboard</a>
    <a class="link-card" href="#" data-ios-click="h153fb37bcb72a526">Logout</a>
</div>

</div>

</div>

<div id="loadingOverlay">
    <div class="loaderBox">
        <div class="spinner"></div>
        <p>Searching...</p>
    </div>
</div>

<script src="js/theme.js?v=contrast-1"></script>
<script src="/js/onboarding-gate.js?v=1"></script>
<script src="js/api.js?v=manufacturing-1"></script>
<script src="js/inventoryTopbar.js?v=3"></script>
<script src="js/workspace.js?v=5"></script>
<script src="/js/pages/search.1.js?v=security-1"></script>


<script src="js/appShell.js?v=5"></script>
</body>
</html>
