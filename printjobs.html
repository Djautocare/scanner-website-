<!DOCTYPE html>
<html lang="en">
<head><script src="/js/security-session.js?v=1"></script><script src="/js/security-events.js?v=1"></script>
<meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d0d0d">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Print Jobs</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
html{touch-action:manipulation;}
*{box-sizing:border-box;}

body{
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top left, rgba(111,66,193,0.16), transparent 35%),
        radial-gradient(circle at top right, rgba(32,201,151,0.10), transparent 35%),
        #0d0d0d;
    color:white;
    padding:18px;
    margin:0;
    overflow-x:hidden;
}

.page{max-width:900px;margin:0 auto;}

.panel{
    background:linear-gradient(180deg,#1d1d1d,#151515);
    border:1px solid rgba(255,255,255,0.08);
    padding:24px;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
}

h1{text-align:center;font-size:34px;margin:12px 0 6px 0;}

.subtitle{
    text-align:center;
    color:#aaa;
    margin:0 0 24px 0;
    font-size:15px;
}

.form-card{
    background:linear-gradient(145deg,#242424,#191919);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:18px;
    margin-bottom:16px;
}

.input-label{
    text-align:left;
    color:#ddd;
    font-weight:bold;
    margin:14px 0 6px 2px;
    font-size:14px;
}

select,
button{
    width:100%;
    padding:14px;
    margin:6px 0 12px 0;
    border:none;
    border-radius:12px;
    font-size:16px;
}

select{
    background:#2a2a2a;
    color:white;
    outline:none;
    border:1px solid rgba(255,255,255,0.08);
}

button{
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.load-button{
    background:linear-gradient(135deg,#0275d8,#025aa5);
    border:1px solid rgba(0,123,255,0.45);
}

.print-button{
    background:linear-gradient(135deg,#20c997,#138f6d);
    border:1px solid rgba(32,201,151,0.45);
}

.refresh-button{
    background:linear-gradient(135deg,#6f42c1,#56329b);
    border:1px solid rgba(111,66,193,0.45);
}

.clear-button{
    background:linear-gradient(135deg,#333,#222);
    border:1px solid rgba(255,255,255,0.10);
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
    margin-top:12px;
}

.summary-card{
    background:#111;
    border:1px solid rgba(255,255,255,0.06);
    border-radius:14px;
    padding:14px;
    text-align:left;
}

.summary-title{
    color:#aaa;
    font-size:13px;
    margin-bottom:6px;
}

.summary-value{
    font-size:22px;
    font-weight:bold;
}

.preview-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
    margin-top:16px;
}

.preview-label{
    background:white;
    color:black;
    border-radius:10px;
    padding:8px;
    text-align:center;
    font-weight:bold;
    font-size:13px;
}

.empty-state{
    background:linear-gradient(145deg,#242424,#191919);
    border:1px solid rgba(255,255,255,0.08);
    padding:18px;
    border-radius:16px;
    text-align:center;
    color:#ddd;
    margin-top:18px;
}

.link-card{
    display:block;
    text-decoration:none;
    color:white;
    background:linear-gradient(135deg,rgba(0,123,255,0.28),rgba(0,123,255,0.08));
    border:1px solid rgba(0,123,255,0.35);
    padding:14px;
    border-radius:14px;
    font-weight:bold;
    text-align:center;
    margin-top:20px;
}

#printLabels{
    display:none;
}

.print-label{
    background:white;
    width:51mm;
    height:25mm;
    padding:1.5mm;
    box-sizing:border-box;
    text-align:center;
    overflow:hidden;
    page-break-after:always;
    break-after:page;
}

.print-label:last-child{
    page-break-after:auto;
    break-after:auto;
}

.print-label svg{
    width:48mm;
    height:17mm;
    display:block;
    margin:0 auto;
}

.label-text{
    color:black;
    font-weight:bold;
    font-size:11px;
    margin:0;
    padding:0;
    line-height:1;
    text-align:center;
}

#loadingOverlay{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    z-index:9999;
    justify-content:center;
    align-items:center;
}

.loaderBox{text-align:center;color:white;font-weight:bold;}

.spinner{
    width:55px;
    height:55px;
    border:6px solid #333;
    border-top:6px solid #20c997;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 15px auto;
}

@keyframes spin{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}

@media(max-width:600px){
    h1{font-size:30px;}
    .panel{padding:18px;}
}

@media print{
    @page{
        size:51mm 25mm;
        margin:0;
    }

    html,
    body{
        width:51mm !important;
        min-height:25mm !important;
        margin:0 !important;
        padding:0 !important;
        background:white !important;
        overflow:visible !important;
    }

    body *{
        display:none !important;
    }

    #printLabels,
    #printLabels *{
        display:block !important;
    }

    #printLabels{
        display:block !important;
        width:51mm !important;
        margin:0 !important;
        padding:0 !important;
        background:white !important;
    }

    .print-label{
        display:block !important;
        position:relative !important;
        width:51mm !important;
        height:25mm !important;
        padding:1.5mm !important;
        margin:0 !important;
        box-sizing:border-box !important;
        background:white !important;
        text-align:center !important;
        overflow:hidden !important;
        page-break-after:always !important;
        break-after:page !important;
    }

    .print-label:last-child{
        page-break-after:auto !important;
        break-after:auto !important;
    }

    .print-label svg{
        width:48mm !important;
        height:17mm !important;
        display:block !important;
        margin:0 auto !important;
    }

    .label-text{
        color:black !important;
        font-size:11px !important;
        font-weight:bold !important;
        margin:0 !important;
        padding:0 !important;
        line-height:1 !important;
        text-align:center !important;
    }

    #loadingOverlay{
        display:none !important;
    }
}
</style>
<link rel="stylesheet" href="css/theme.css?v=contrast-1">
</head>

<body>

<div class="page">
<div class="panel">

<h1>Print Jobs</h1>
<p class="subtitle">Select a saved print job and print all its barcode labels</p>

<div class="form-card">

<div class="input-label">Select Print Job</div>
<select id="printJobSelect">
<option value="">Loading print jobs...</option>
</select>

<button class="load-button" data-ios-click="h84c28000558f5627">Load Print Job</button>
<button class="print-button" data-ios-click="h44e2955e4d29d205">Print Loaded Labels</button>
<button class="refresh-button" data-ios-click="h2103eed757bb5739">Refresh Print Jobs</button>
<button class="clear-button" data-ios-click="h61d65e12593becd3">Clear Loaded Labels</button>
        <button class="clear-button" id="deletePrintJobButton" type="button" data-ios-click="hb7ed65e7fff439d3">Delete Print Job</button>

</div>

<div id="summary"></div>

<div id="preview"></div>

<a class="link-card" href="index.html">← Back to Dashboard</a>
<a class="link-card" href="#" data-ios-click="h153fb37bcb72a526">Logout</a>

</div>
</div>

<div id="printLabels"></div>

<div id="loadingOverlay">
    <div class="loaderBox">
        <div class="spinner"></div>
        <p>Working...</p>
    </div>
</div>

<script src="js/theme.js?v=contrast-1"></script>
<script src="js/api.js"></script>
<script src="js/inventoryTopbar.js?v=2"></script>
<script src="js/workspace.js?v=5"></script>
<script src="/js/pages/printjobs.1.js?v=security-1"></script>

</body>
</html>
