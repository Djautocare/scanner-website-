<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0d">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Discard Stock</title>
<style>
*{box-sizing:border-box} body{font-family:Arial,sans-serif;margin:0;padding:18px;color:white;background:radial-gradient(circle at top left,rgba(220,53,69,.14),transparent 35%),#0d0d0d}.page{max-width:760px;margin:auto}.panel{background:linear-gradient(180deg,#1d1d1d,#151515);border:1px solid rgba(255,255,255,.08);padding:24px;border-radius:18px}.form-card{background:linear-gradient(145deg,#242424,#191919);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px}h1{text-align:center;font-size:34px;margin:12px 0 6px}.subtitle{text-align:center;color:#aaa;margin:0 0 24px}.input-label{font-weight:bold;color:#ddd;margin:14px 0 6px 2px;font-size:14px}input,select,textarea,button{width:100%;padding:14px;margin:6px 0 12px;border-radius:12px;font-size:16px}input,select,textarea{background:#2a2a2a;color:white;border:1px solid rgba(255,255,255,.08)}button{border:0;color:white;font-weight:bold;cursor:pointer}.discard-button{background:linear-gradient(135deg,#dc3545,#8f1f2b)}.secondary-button{background:linear-gradient(135deg,#555,#2d2d2d)}.suggest-toggle{background:linear-gradient(135deg,rgba(111,66,193,.28),rgba(111,66,193,.08));border:1px solid rgba(111,66,193,.35)}.suggest-panel{display:none;background:#111;border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;margin-bottom:14px}.suggest-panel.open{display:block}.suggest-item{padding:13px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}.suggest-title{font-weight:bold}.suggest-meta,.helper-text{color:#aaa;font-size:13px}.bundle-card{background:#1b1b1b;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;margin:12px 0}.bundle-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#2a2a2a;border-radius:12px;padding:10px;margin:8px 0}.bundle-item button{width:auto;margin:0;padding:8px 10px;background:#a92735}.button-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.location-button{background:#025aa5}.location-card{background:#2a2a2a;border-radius:14px;padding:14px;margin:10px 0}#result{margin-top:15px;font-weight:bold;background:#2a2a2a;border-radius:14px;padding:12px;min-height:45px}.links-grid{display:grid;gap:12px;margin-top:16px}.link-card{display:block;text-decoration:none;color:white;background:rgba(0,123,255,.15);border:1px solid rgba(0,123,255,.35);padding:14px;border-radius:14px;text-align:center;font-weight:bold}@media(max-width:600px){.panel{padding:18px}.button-grid{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/inventoryTopbar.css"><link rel="stylesheet" href="css/appShell.css?v=4">
</head>
<body><div class="page"><div class="panel"><div id="inventory-topbar"></div>
<h1>Discard Stock</h1><p class="subtitle">Remove broken, lost, donated or otherwise unsellable stock without recording a sale.</p>
<div class="form-card">
<div class="input-label">Barcode or Item Name</div><input id="barcode" placeholder="Type barcode, number, or item words">
<button class="suggest-toggle" type="button" onclick="document.getElementById('suggestPanel').classList.toggle('open')">Suggested Items</button>
<div id="suggestPanel" class="suggest-panel"></div>
<div class="button-grid"><button class="secondary-button" onclick="addToBundle()">Add to Discard List</button><button class="secondary-button" onclick="clearBundle()">Clear List</button></div>
<div id="bundleBox" class="bundle-card" style="display:none"></div>
<div class="input-label">Quantity</div><input type="number" id="qty" value="1" min="1" step="1">
<div class="input-label">Reason</div><select id="reason"><option value="">Choose reason</option><option>Broken</option><option>Damaged</option><option>Lost</option><option>Expired</option><option>Donated</option><option>Personal use</option><option>Supplier return</option><option>Theft</option><option>Other</option></select>
<div class="input-label">Notes (optional)</div><textarea id="notes" rows="3" placeholder="Add details. Required only when reason is Other."></textarea>
<div class="input-label">Estimated loss £ (optional)</div><input type="number" id="estimatedLoss" min="0" step="0.001" placeholder="Leave blank if unknown">
<button class="discard-button" onclick="discardPressed()">Discard Stock</button>
<div id="locationChoices"></div><p id="result">Ready to discard stock.</p>
</div><div class="links-grid"><a class="link-card" href="index.html">← Back to Dashboard</a></div>
</div></div>
<script src="js/theme.js"></script><script src="js/api.js"></script><script src="js/inventoryTopbar.js?v=5"></script><script src="js/workspace.js?v=4"></script><script src="js/appShell.js?v=4"></script>
<script>
if(!InventoryAPI.requireLogin()) throw new Error("Login required");
let suggestions=[], timer=null, bundle=[], pending=[];
function normaliseBarcode(v){let b=String(v||"").trim().toUpperCase().replace(/\s+/g,"");if(/^\d+$/.test(b))b="ITEM-"+b;if(/^ITEM\d+$/.test(b))b=b.replace("ITEM","ITEM-");return b}
function esc(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function renderBundle(){const box=document.getElementById("bundleBox");if(!bundle.length){box.style.display="none";box.innerHTML="";return}box.style.display="block";box.innerHTML="<strong>Discard List ("+bundle.length+")</strong>"+bundle.map((b,i)=>`<div class="bundle-item"><span>${esc(b)}</span><button onclick="bundle.splice(${i},1);renderBundle()">Remove</button></div>`).join("")}
function addToBundle(){const b=normaliseBarcode(document.getElementById("barcode").value);if(!b)return alert("Enter or choose an item first");bundle.push(b);document.getElementById("barcode").value="";renderBundle()}
function clearBundle(){bundle=[];pending=[];renderBundle();document.getElementById("locationChoices").innerHTML=""}
function search(){const q=document.getElementById("barcode").value.trim();clearTimeout(timer);if(q.length<2||/^\d+$/.test(q)){document.getElementById("suggestPanel").innerHTML="";return}timer=setTimeout(async()=>{const d=await InventoryAPI.request("/search?query="+encodeURIComponent(q));suggestions=(d.results||[]).slice(0,12);document.getElementById("suggestPanel").innerHTML=suggestions.map((x,i)=>`<div class="suggest-item" onclick="choose(${i})"><div class="suggest-title">${esc(x.description)}</div><div class="suggest-meta">${esc(x.barcode||x.itemId)} · Qty ${Number(x.totalQty||0)}</div></div>`).join("")||"<div class='suggest-item'>No matches</div>"},250)}
function choose(i){const x=suggestions[i];if(!x)return;document.getElementById("barcode").value=normaliseBarcode(x.barcode||x.itemId);document.getElementById("suggestPanel").classList.remove("open")}
async function discardOne(item){const payload={barcode:item.barcode,qty:item.qty,location:item.location||"",reason:document.getElementById("reason").value,notes:document.getElementById("notes").value,estimated_loss:document.getElementById("estimatedLoss").value};const d=await InventoryAPI.request("/discard/remove",{method:"POST",body:JSON.stringify(payload)});if(d.needsLocation){showLocations(item,d.locations);return false}if(!d.success)throw new Error(d.error||"Discard failed");document.getElementById("result").innerText=`Discarded ${d.discardedQty} × ${d.description} from ${d.location}. Remaining: ${d.remainingQty}`;return true}
function showLocations(item,locations){pending.unshift(item);document.getElementById("locationChoices").innerHTML="<div class='location-card'><strong>Select location for "+esc(item.barcode)+"</strong></div>"+locations.map(l=>`<button class="location-button" onclick="continueLocation('${esc(l.location)}')">${esc(l.location)} — Qty ${l.qty}</button>`).join("")}
async function continueLocation(location){const item=pending.shift();item.location=location;document.getElementById("locationChoices").innerHTML="";pending.unshift(item);processPending()}
async function processPending(){if(!pending.length){bundle=[];renderBundle();document.getElementById("barcode").value="";document.getElementById("qty").value="1";return}const item=pending.shift();try{const done=await discardOne(item);if(done)processPending()}catch(e){pending=[];document.getElementById("result").innerText=e.message}}
function discardPressed(){const reason=document.getElementById("reason").value,notes=document.getElementById("notes").value.trim();if(!reason)return alert("Choose a discard reason");if(reason==="Other"&&!notes)return alert("Add notes for Other");if(bundle.length){pending=bundle.map(b=>({barcode:b,qty:1,location:""}))}else{const b=normaliseBarcode(document.getElementById("barcode").value);if(!b)return alert("Enter or choose an item");pending=[{barcode:b,qty:Number(document.getElementById("qty").value||1),location:""}]}processPending()}
document.getElementById("barcode").addEventListener("input",search);document.getElementById("barcode").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addToBundle()}});
</script></body></html>
