<!DOCTYPE html>
<html lang="en">
<head><script src="/js/security-session.js?v=1"></script><script src="/js/security-events.js?v=1"></script>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Discard Stock</title>
<style>
*{box-sizing:border-box} body{font-family:Arial,sans-serif;margin:0;padding:18px;color:white;background:radial-gradient(circle at top left,rgba(220,53,69,.14),transparent 35%),#0d0d0d}.page{max-width:760px;margin:auto}.panel{background:linear-gradient(180deg,#1d1d1d,#151515);border:1px solid rgba(255,255,255,.08);padding:24px;border-radius:18px}.form-card{background:linear-gradient(145deg,#242424,#191919);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px}h1{text-align:center;font-size:34px;margin:12px 0 6px}.subtitle{text-align:center;color:#aaa;margin:0 0 24px}.input-label{font-weight:bold;color:#ddd;margin:14px 0 6px 2px;font-size:14px}input,select,textarea,button{width:100%;padding:14px;margin:6px 0 12px;border-radius:12px;font-size:16px}input,select,textarea{background:#2a2a2a;color:white;border:1px solid rgba(255,255,255,.08)}button{border:0;color:white;font-weight:bold;cursor:pointer}.discard-button{background:linear-gradient(135deg,#dc3545,#8f1f2b)}.secondary-button{background:linear-gradient(135deg,#555,#2d2d2d)}.suggest-toggle{background:linear-gradient(135deg,rgba(111,66,193,.28),rgba(111,66,193,.08));border:1px solid rgba(111,66,193,.35)}.suggest-panel{display:none;background:#111;border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;margin-bottom:14px}.suggest-panel.open{display:block}.suggest-item{padding:13px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}.suggest-title{font-weight:bold}.suggest-meta,.helper-text{color:#aaa;font-size:13px}.bundle-card{background:#1b1b1b;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;margin:12px 0}.bundle-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#2a2a2a;border-radius:12px;padding:10px;margin:8px 0}.bundle-item button{width:auto;margin:0;padding:8px 10px;background:#a92735}.button-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.location-button{background:#025aa5}.location-card{background:#2a2a2a;border-radius:14px;padding:14px;margin:10px 0}#result{margin-top:15px;font-weight:bold;background:#2a2a2a;border-radius:14px;padding:12px;min-height:45px}.links-grid{display:grid;gap:12px;margin-top:16px}.link-card{display:block;text-decoration:none;color:white;background:rgba(0,123,255,.15);border:1px solid rgba(0,123,255,.35);padding:14px;border-radius:14px;text-align:center;font-weight:bold}@media(max-width:600px){.panel{padding:18px}.button-grid{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="css/theme.css?v=contrast-1"><link rel="stylesheet" href="css/inventoryTopbar.css"><link rel="stylesheet" href="css/appShell.css?v=4">
</head>
<body><div class="page"><div class="panel"><div id="inventory-topbar"></div>
<h1>Discard Stock</h1><p class="subtitle">Remove broken, lost, donated or otherwise unsellable stock without recording a sale.</p>
<div class="form-card">
<div class="input-label">Barcode or Item Name</div><input id="barcode" placeholder="Type barcode, number, or item words">
<button class="suggest-toggle" type="button" data-ios-click="had2ae2724bdcf0e0">Suggested Items</button>
<div id="suggestPanel" class="suggest-panel"></div>
<div class="button-grid"><button class="secondary-button" data-ios-click="hc5db30324471be14">Add to Discard List</button><button class="secondary-button" data-ios-click="hc841f4a73236ea77">Clear List</button></div>
<div id="bundleBox" class="bundle-card" style="display:none"></div>
<div class="input-label">Quantity</div><input type="number" id="qty" value="1" min="1" step="1">
<div class="input-label">Reason</div><select id="reason"><option value="">Choose reason</option><option>Broken</option><option>Damaged</option><option>Lost</option><option>Expired</option><option>Donated</option><option>Personal use</option><option>Supplier return</option><option>Theft</option><option>Other</option></select>
<div class="input-label">Notes (optional)</div><textarea id="notes" rows="3" placeholder="Add details. Required only when reason is Other."></textarea>
<div class="input-label">Estimated loss £ (optional)</div><input type="number" id="estimatedLoss" min="0" step="0.001" placeholder="Leave blank if unknown">
<button class="discard-button" data-ios-click="hff9dc0c8af4c0815">Discard Stock</button>
<div id="locationChoices"></div><p id="result" data-location-wording-ignore>Ready to discard stock.</p>
</div><div class="links-grid"><a class="link-card" href="index.html">← Back to Dashboard</a></div>
</div></div>
<script src="js/theme.js?v=contrast-1"></script><script src="/js/onboarding-gate.js?v=1"></script>
<script src="js/api.js"></script><script src="js/inventoryTopbar.js?v=5"></script><script src="js/workspace.js?v=5"></script><script src="js/appShell.js?v=5"></script>
<script src="/js/pages/discard.1.js?v=security-1"></script></body></html>
