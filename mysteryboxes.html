<!DOCTYPE html>
<html lang="en">
<head><script src="/js/security-session.js?v=1"></script><script src="/js/security-events.js?v=1"></script>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d0d0d">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Mystery Boxes</title>

<style>
html{touch-action:manipulation;}
*{box-sizing:border-box;}

body{
    font-family:Arial, sans-serif;
    background:
        radial-gradient(circle at top left, rgba(156,39,176,0.18), transparent 35%),
        radial-gradient(circle at top right, rgba(255,193,7,0.14), transparent 35%),
        radial-gradient(circle at bottom, rgba(40,167,69,0.08), transparent 35%),
        #0d0d0d;
    color:white;
    padding:18px;
    margin:0;
    overflow-x:hidden;
}

.page{max-width:1150px;margin:0 auto;}

.panel{
    background:linear-gradient(180deg,#1d1d1d,#151515);
    border:1px solid rgba(255,255,255,0.08);
    padding:24px;
    border-radius:22px;
    box-shadow:0 24px 70px rgba(0,0,0,0.42);
}

h1{
    text-align:center;
    font-size:34px;
    margin:12px 0 6px 0;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin:0 0 24px 0;
    font-size:15px;
    line-height:1.4;
}

.top-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:18px;
}

.top-actions.single-action{
    grid-template-columns:1fr;
}

.action-link,
.refresh-button{
    display:block;
    text-decoration:none;
    width:100%;
    padding:14px;
    margin:0;
    border:none;
    border-radius:14px;
    font-size:16px;
    font-weight:bold;
    text-align:center;
    cursor:pointer;
}

.action-link{
    color:black;
    background:linear-gradient(135deg,#ffc107,#d39e00);
    border:1px solid rgba(255,193,7,0.45);
}

.refresh-button{
    color:white;
    background:linear-gradient(135deg,#9c27b0,#6f1a80);
    border:1px solid rgba(156,39,176,0.45);
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
    margin-bottom:18px;
}

.summary-card{
    background:linear-gradient(145deg,#242424,#191919);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:14px;
}

.summary-title{
    color:#aaa;
    font-size:12px;
    font-weight:bold;
    margin-bottom:6px;
}

.summary-value{
    font-size:22px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:14px;
    margin-top:18px;
}

.mb-card{
    background:linear-gradient(145deg,#242424,#191919);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:18px;
    text-align:left;
    position:relative;
    overflow:hidden;
}

.mb-card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:4px;
    background:#777;
}

.mb-card.profit::before{
    background:linear-gradient(135deg,#00e676,#28a745);
}

.mb-card.loss::before{
    background:linear-gradient(135deg,#ff5252,#dc3545);
}

.mb-card.break-even::before{
    background:linear-gradient(135deg,#ffc107,#d39e00);
}

.mb-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:12px;
}

.mb-id{
    background:rgba(156,39,176,0.22);
    color:#e58cff;
    border:1px solid rgba(156,39,176,0.38);
    padding:7px 10px;
    border-radius:999px;
    font-weight:bold;
    font-size:13px;
    white-space:nowrap;
}

.mb-name{
    font-size:20px;
    font-weight:bold;
    line-height:1.25;
}

.mb-sub{
    color:#aaa;
    font-size:13px;
    margin-top:5px;
}

.badge-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:10px 0 4px 0;
}

.status,
.profit-badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:999px;
    font-size:13px;
    font-weight:bold;
}

.status-active{
    background:rgba(40,167,69,0.20);
    color:#54d86f;
    border:1px solid rgba(40,167,69,0.35);
}

.status-closed{
    background:rgba(120,120,120,0.22);
    color:#bbb;
    border:1px solid rgba(255,255,255,0.15);
}

.profit-positive{
    background:rgba(0,230,118,0.16);
    color:#00e676;
    border:1px solid rgba(0,230,118,0.35);
}

.profit-negative{
    background:rgba(255,82,82,0.16);
    color:#ff7777;
    border:1px solid rgba(255,82,82,0.35);
}

.profit-even{
    background:rgba(255,193,7,0.16);
    color:#ffc107;
    border:1px solid rgba(255,193,7,0.35);
}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:12px;
}

.stat-box{
    background:#111;
    border:1px solid rgba(255,255,255,0.06);
    border-radius:12px;
    padding:10px;
}

.stat-title{
    color:#aaa;
    font-size:12px;
    margin-bottom:5px;
    font-weight:bold;
}

.stat-value{
    font-size:16px;
    font-weight:bold;
}

.green{color:#00e676;}
.red{color:#ff5252;}
.yellow{color:#ffc107;}
.blue{color:#66b2ff;}
.grey{color:#bbb;}

.progress-wrap{
    background:#111;
    border:1px solid rgba(255,255,255,0.06);
    border-radius:12px;
    padding:12px;
    margin-top:10px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
    font-weight:bold;
}

.progress-bar{
    height:10px;
    background:#333;
    border-radius:999px;
    overflow:hidden;
    margin-top:9px;
}

.progress-fill{
    height:100%;
    background:linear-gradient(135deg,#ffc107,#00e676);
    width:0%;
}

.info-box{
    background:#111;
    border:1px solid rgba(255,255,255,0.06);
    border-radius:12px;
    padding:10px;
    margin-top:10px;
    color:#ddd;
    line-height:1.35;
}

.card-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
}

button{
    width:100%;
    padding:14px;
    margin:0;
    border:none;
    border-radius:12px;
    font-size:15px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.view-button{
    background:linear-gradient(135deg,#333,#222);
    border:1px solid rgba(255,255,255,0.10);
}

.close-button{
    background:linear-gradient(135deg,#dc3545,#8d1f2b);
    border:1px solid rgba(220,53,69,0.45);
}

.items-list{
    display:none;
    margin-top:12px;
    background:#111;
    border:1px solid rgba(255,255,255,0.06);
    border-radius:12px;
    padding:10px;
}

.item-row{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
}

.item-row:last-child{
    border-bottom:none;
}

.item-name{
    font-weight:bold;
}

.item-meta{
    color:#aaa;
    font-size:12px;
    margin-top:3px;
    line-height:1.35;
}

.item-left{
    font-weight:bold;
    color:#ffd75e;
    white-space:nowrap;
}

.empty-state{
    background:linear-gradient(145deg,#242424,#191919);
    border:1px solid rgba(255,255,255,0.08);
    padding:18px;
    border-radius:16px;
    text-align:center;
    color:#ddd;
    margin-top:18px;
}

.link-card{
    display:block;
    text-decoration:none;
    color:white;
    background:linear-gradient(135deg, rgba(0,123,255,0.28), rgba(0,123,255,0.08));
    border:1px solid rgba(0,123,255,0.35);
    padding:14px;
    border-radius:14px;
    font-weight:bold;
    text-align:center;
    margin-top:20px;
}

#result{
    text-align:center;
    font-weight:bold;
    margin-top:10px;
}

#loadingOverlay{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    z-index:9999;
    justify-content:center;
    align-items:center;
}

.loaderBox{
    text-align:center;
    color:white;
    font-weight:bold;
}

.spinner{
    width:55px;
    height:55px;
    border:6px solid #333;
    border-top:6px solid #9c27b0;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 15px auto;
}

@keyframes spin{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}

@media(max-width:760px){
    h1{font-size:30px;}
    .panel{padding:18px;}
    .top-actions{grid-template-columns:1fr;}
    .stat-grid{grid-template-columns:1fr 1fr;}
    .mb-header{flex-direction:column;}
    .card-actions{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="page">

<div class="panel">

<h1>Mystery Boxes</h1>
<p class="subtitle">View profit by MB snapshot batch, track sell-through, and manage active/bulk sold status.</p>

<div class="top-actions single-action">
    <button class="refresh-button" data-ios-click="hd2599477aa4af45a">Refresh Profit Page</button>
</div>

<div id="summary"></div>

<div id="result"></div>

<div id="mysteryBoxList">
    <div class="empty-state">Loading mystery boxes...</div>
</div>

<a class="link-card" href="index.html">← Back to Dashboard</a>
<a class="link-card" href="#" data-ios-click="h153fb37bcb72a526">Logout</a>

</div>

</div>

<div id="loadingOverlay">
    <div class="loaderBox">
        <div class="spinner"></div>
        <p>Working...</p>
    </div>
</div>

<script src="/js/onboarding-gate.js?v=1"></script>
<script src="js/api.js"></script>
<script src="/js/pages/mysteryboxes.1.js?v=upload-safety-1"></script>

</body>
</html>
