<!DOCTYPE html>
<html lang="en">
<head><script src="/js/security-session.js?v=1"></script><script src="/js/security-events.js?v=1"></script>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0d">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Corrections</title>

<style>
html{touch-action:manipulation;}
*{box-sizing:border-box;}

body{
    font-family:Arial,sans-serif;
    margin:0;
    padding:18px;
    color:white;
    background:#0d0d0d;
}

.page{max-width:1120px;margin:0 auto;}
.panel{padding:0;}

h1{margin:0 0 6px;font-size:34px;}
.subtitle{color:#aaa;margin:0 0 22px;}

.correction-toolbar{
    display:grid;
    grid-template-columns:1fr auto;
    gap:12px;
    align-items:center;
    margin-bottom:16px;
}

.filter-grid{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.filter-button,
.refresh-button,
.save-button,
.cancel-button{
    width:auto;
    margin:0;
    padding:11px 14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.1);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.filter-button,
.cancel-button{
    background:#242128;
}

.filter-button.active,
.refresh-button,
.save-button{
    background:linear-gradient(135deg,var(--accent),rgba(var(--accent-rgb),.62));
    border-color:rgba(var(--accent-rgb),.42);
}

.activity-list{
    display:grid;
    gap:12px;
}

.activity-card{
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:17px;
    background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
}

.activity-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
}

.activity-title{
    font-size:17px;
    font-weight:bold;
}

.activity-meta{
    color:#aaa;
    font-size:12px;
    line-height:1.45;
    margin-top:5px;
}

.action-badge,
.corrected-badge{
    display:inline-flex;
    align-items:center;
    border-radius:999px;
    padding:5px 9px;
    font-size:11px;
    font-weight:bold;
}

.action-badge{
    color:var(--accent);
    border:1px solid rgba(var(--accent-rgb),.28);
    background:rgba(var(--accent-rgb),.1);
}

.corrected-badge{
    color:#8dffb0;
    border:1px solid rgba(40,167,69,.28);
    background:rgba(40,167,69,.1);
    margin-left:6px;
}

.activity-values{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:9px;
    margin-top:14px;
}

.value-box{
    border:1px solid rgba(255,255,255,.07);
    border-radius:12px;
    padding:10px;
    background:#100e13;
}

.value-label{
    color:#888;
    font-size:10px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:.06em;
}

.value-text{
    margin-top:4px;
    font-weight:bold;
    word-break:break-word;
}

.correct-button{
    width:100%;
    margin:13px 0 0;
    padding:11px;
    border-radius:12px;
    border:1px solid rgba(var(--accent-rgb),.35);
    color:white;
    font-weight:bold;
    cursor:pointer;
    background:rgba(var(--accent-rgb),.1);
}

.editor{
    display:none;
    margin-top:13px;
    padding-top:13px;
    border-top:1px solid rgba(255,255,255,.07);
}

.editor.open{display:block;}

.editor-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
}

.editor label{
    color:#bbb;
    font-size:12px;
    font-weight:bold;
}

.editor input,
.editor select{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:11px;
    background:#151219;
    color:white;
    font-size:15px;
}

.editor-actions{
    display:flex;
    gap:9px;
    margin-top:12px;
}

.empty-state{
    padding:24px;
    text-align:center;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    color:#aaa;
    background:#100e13;
}

.result{
    margin-bottom:14px;
    border-radius:12px;
    padding:11px;
    display:none;
}

.result.success{
    display:block;
    color:#8dffb0;
    border:1px solid rgba(40,167,69,.25);
    background:rgba(40,167,69,.09);
}

.result.error{
    display:block;
    color:#ff9b9b;
    border:1px solid rgba(220,53,69,.25);
    background:rgba(220,53,69,.09);
}

@media(max-width:720px){
    .correction-toolbar{grid-template-columns:1fr;}
    .refresh-button{width:100%;}
    .activity-head{display:block;}
    .action-badge{margin-top:10px;}
    .editor-actions{display:grid;}
    .save-button,.cancel-button{width:100%;}
}

.change-product-card{margin:0 0 18px;padding:18px;border:1px solid rgba(var(--accent-rgb),.25);border-radius:18px;background:linear-gradient(145deg,rgba(var(--accent-rgb),.10),rgba(255,255,255,.018));}
.change-product-card h2{margin:0 0 6px;}
.change-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.change-product-card input,.change-product-card select{width:100%;padding:12px;margin-top:6px;border:1px solid rgba(255,255,255,.08);border-radius:11px;background:#151219;color:white;}
.product-results{display:grid;gap:7px;margin-top:8px;max-height:230px;overflow:auto;}
.product-choice{padding:10px;border:1px solid rgba(255,255,255,.08);border-radius:11px;background:#100e13;cursor:pointer;}
.product-choice.selected{border-color:rgba(var(--accent-rgb),.65);background:rgba(var(--accent-rgb),.12);}
@media(max-width:720px){.change-grid{grid-template-columns:1fr;}}
</style>

<link rel="stylesheet" href="css/theme.css?v=contrast-1">
<link rel="stylesheet" href="css/inventoryTopbar.css">
<link rel="stylesheet" href="css/appShell.css?v=4">
</head>

<body>
<div class="page">
<div class="panel">

<div id="inventory-topbar"></div>

<h1>Corrections</h1>
<p class="subtitle">Review the latest 30 stock and sales entries, then safely correct quantities, locations or sale prices.</p>


<div class="change-product-card">
    <h2>Change Item</h2>
    <p class="subtitle" style="text-align:left;margin-bottom:0;">Move some or all stock from an incorrectly assigned product to the correct product while keeping the same location.</p>
    <div class="change-grid">
        <div>
            <label>Current item and location</label>
            <input id="currentProductSearch" placeholder="Search current item or barcode">
            <div id="currentProductResults" class="product-results"></div>
        </div>
        <div>
            <label>Change to</label>
            <input id="replacementProductSearch" placeholder="Search replacement item or barcode">
            <div id="replacementProductResults" class="product-results"></div>
        </div>
    </div>
    <div class="change-grid">
        <label>Quantity
            <input type="number" id="changeProductQty" min="1" step="1" value="1">
        </label>
        <label>Reason
            <input id="changeProductReason" placeholder="Optional correction note">
        </label>
    </div>
    <button class="save-button" style="width:100%;margin-top:12px;" data-ios-click="h4bb7887586b1aefa">Change Item</button>
</div>

<div id="result" class="result"></div>

<div class="correction-toolbar">
    <div class="filter-grid">
        <button class="filter-button active" data-filter="ALL" data-ios-click="h6866c927c44c09d7">All</button>
        <button class="filter-button" data-filter="ADD" data-ios-click="h5ae05d0ebab3ee8a">Added</button>
        <button class="filter-button" data-filter="REMOVE" data-ios-click="h15b501cba164f866">Removed</button>
        <button class="filter-button" data-filter="MOVE" data-ios-click="hff359ccd5b32c40d">Moved</button>
        <button class="filter-button" data-filter="SALE" data-ios-click="h484c2ca47f7b5435">Sales</button>
        <button class="filter-button" data-filter="RETURN" data-ios-click="h9c88ea6583b7c2a6">Returns</button>
    </div>

    <button class="refresh-button" data-ios-click="h942fcf38f8f60b19">Refresh</button>
</div>

<div id="activityList" class="activity-list">
    <div class="empty-state">Loading recent activity...</div>
</div>

</div>
</div>

<script src="js/theme.js?v=contrast-1"></script>
<script src="/js/onboarding-gate.js?v=1"></script>
<script src="js/api.js?v=manufacturing-1"></script>
<script src="js/inventoryTopbar.js?v=5"></script>
<script src="js/workspace.js?v=5"></script>
<script src="js/appShell.js?v=5"></script>

<script src="/js/pages/corrections.1.js?v=security-1"></script>
</body>
</html>
