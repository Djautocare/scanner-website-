<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Reordering | InventoryOS</title><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/manufacturing.css?v=2"><link rel="stylesheet" href="css/inventoryTopbar.css"><link rel="stylesheet" href="css/appShell.css?v=3"><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#0d0d0d;color:#f7f7f8;font-family:Arial,sans-serif}.page{max-width:1200px;margin:auto}.panel{background:linear-gradient(180deg,#1d1d1d,#151515);border:1px solid #ffffff14;border-radius:18px;padding:24px;box-shadow:0 20px 60px #0005}h1{margin:8px 0;font-size:32px}.subtitle{color:#aaa;margin:0 0 20px}.toolbar,.tabs,.actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.toolbar button,.tabs button,.actions button,.card button,.modal button,.email-panel button{border:0;border-radius:10px;padding:10px 14px;background:linear-gradient(135deg,var(--accent,#45d36a),rgba(var(--accent-rgb,69,211,106),.72));color:#fff;font-weight:700;cursor:pointer;transition:filter .16s ease,transform .16s ease,border-color .16s ease}.toolbar button:not(.secondary):hover,.card button:not(.secondary):hover,.email-panel button:not(.secondary):hover{filter:brightness(1.12);transform:translateY(-1px)}.secondary,.tabs button{background:rgba(var(--accent-rgb,69,211,106),.10)!important;color:var(--text,#fff)!important}.toolbar .secondary,.card-actions .secondary,.actions button.secondary,.modal button.secondary,.email-panel button.secondary{border:1px solid rgba(var(--accent-rgb,69,211,106),.48)!important;color:var(--text,#fff)!important;box-shadow:inset 0 1px 0 #ffffff12;transition:background .16s ease,border-color .16s ease,transform .16s ease}.toolbar .secondary:hover,.card-actions .secondary:hover,.actions button.secondary:hover,.modal button.secondary:hover,.email-panel button.secondary:hover{background:rgba(var(--accent-rgb,69 </style></head><body><div class="page"><div class="panel"><h1>Reordering</h1><p class="subtitle">Track low stock, mark supplier orders, receive them and assign stock to its destination.</p><div class="toolbar"><button id="createRule" class="secondary">Create item reorder rule</button><button id="adjustBtn" class="secondary" aria-pressed="false">Adjustments</button><button id="emailBtn" class="secondary" aria-pressed="false">Email reminders</button><button id="refreshBtn" class="secondary">Refresh</button></div><div id="summary" class="summary">Loading reorder rules…</div><div id="locked" class="locked hidden"></div><div id="appContent"><div id="emailPanel" class="email-panel hidden"></div><div class="tabs"><button class="active" data-view="needed">Needs reordering <span id="neededCount"></span></button><button data-view="ordered">Ordered <span id="orderedCount"></span></button><button data-view="received">Destination assigning <span id="receivedCount"></span></button><button data-view="all">All rules</button></div><div id="content" class="grid"></div><section id="recipeMaterialOrders" class="mfg-page mfg-reorder-section" hidden></section></div><div id="status" class="status" role="status"></div></div></div><div id="confirmModal" class="modal-backdrop hidden"><div class="modal"><h2>Confirm stock received</h2><p>Please check the items and quantities received:</p><div id="receiveList"></div><div class="actions"><button id="confirmReceive">Confirm received</button><button id="cancelReceive" class="secondary">Cancel</button></div></div></div>
<dialog id="recipeMaterialDialog" class="mfg-dialog"><div class="mfg-dialog-head"><h2 id="recipeMaterialDialogTitle"></h2><button type="button" onclick="document.getElementById('recipeMaterialDialog').close()">Close</button></div><div id="recipeMaterialDialogBody"></div></dialog><script src="js/theme.js"></script><script src="js/api.js?v=manufacturing-1"></script><script src="js/workspace.js?v=5"></script><script src="js/inventoryTopbar.js?v=5"></script><script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.4/qz-tray.js"></script><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="js/qzClient.js?v=10"></script>
<script src="js/reorderCosts.js?v=1"></script><script>(function(){const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));function host(v){try{return new URL(v).hostname.replace(/^www\./,"")}catch{return "Supplier site"}}let rules=[],orders=[],destinations=[],view="needed",expand=null,adjust=false,receiveIds=[];const req=(path,opts)=>InventoryAPI.request(path,opts);function locked(d){if(!d?.billing_required&&!d?.upgrade_required)return false;$("appContent").classList.add("hidden");$("summary").classList.add("hidden");$("locked").classList.remove("hidden");$("locked").innerHTML='<h2>Reordering is a Pro feature</h2><p>'+esc(d.error||"Upgrade to Pro to use reorder rules.")+'</p><a href="billing.html?plan=pro&source=reorder-feature">View Pro plan</a>';return true}async function load(){ $("status").textContent="Loading…";const [rd,od,dd]=await Promise.all([req("/reorder?_t="+Date.now()),req("/reorder/orders?_t="+Date.now()),req("/reorder/destinations?_t="+Date.now())]);if(locked(rd))return;if(!rd.success){$("status").textContent=rd.error||"Could not load reorder rules";return}rules=rd.rules||[];orders=od.success?od.orders||[]:[];destinations=dd.success?dd.locations||[]:[];render()}
function tabs(){document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));$("neededCount").textContent=" ("+rules.filter(r=>r.needs_reorder).length+")";$("orderedCount").textContent=" ("+orders.filter(o=>o.status==="ordered").length+")";$("receivedCount").textContent=" ("+orders.filter(o=>o.status==="received").length+")"}
function ruleCard(r){const supplier=r.product_url||r.website_url;const expanded=String(expand)===String(r.id);return '<article class="card"><div class="cardhead"><div><div class="name">'+esc(r.item_name||"Unnamed item")+'</div><div class="hint">'+esc(r.inventory_name||"Inventory")+' · '+esc(r.barcode||"")+'</div></div><span class="pill">'+(r.needs_reorder?'Order '+Number(r.quantity_to_order):r.has_open_order?'Order in progress':'Stock '+Number(r.current_stock))+'</span></div>'+(supplier?'<a class="link" href="'+esc(supplier)+'" target="_blank" rel="noopener">'+esc((()=>{try{return new URL(supplier).hostname.replace(/^www\\./," ")}catch{return supplier}})())+' ↗</a>':'')+ReorderCosts.estimated(r)+(expanded?'<div class="detail">Current stock: <strong>'+Number(r.current_stock)+'</strong><br>Minimum: <strong>'+Number(r.minimum_stock)+'</strong><br>Reorder up to: <strong>'+Number(r.reorder_to)+'</strong><br>Product link: '+(r.product_url?'<a href="'+esc(r.product_url)+'" target="_blank">Open</a>':'Unknown')+'<br>Supplier website: '+(r.website_url?'<a href="'+esc(r.website_url)+'" target="_blank">Open</a>':'Unknown')+'<br>Supplier phone: '+esc(r.supplier_phone||"Unknown")+'<br>Supplier email: '+esc(r.supplier_email||"Unknown")+'</div>':'')+'<div class="card-actions">'+(r.needs_reorder?'<button data-order="'+r.id+'">Ordered · '+Number(r.quantity_to_order)+'</button>':'')+'<button class="secondary" data-expand="'+r.id+'">'+(expanded?'Hide details':'Details')+'</button>'+(adjust?'<a class="link" href="reorder-rule.html?id='+encodeURIComponent(r.id)+'">Edit rule</a><button class="secondary" data-delete-rule="'+Number(r.id)+'" '+(r.has_open_order?'disabled title="Finish or delete the open order first"':'')+'>Delete rule</button>':'')+'</div></article>'}
function orderCard(o,withSelect=false){const href=o.product_url||o.website_url;return '<article class="card"><div class="cardhead"><div><div class="name">'+(withSelect?'<label><input type="checkbox" data-order-select="'+o.id+'" style="width:auto;margin-right:8px">':'')+esc(o.item_name)+'</label></div><div class="hint">'+esc(o.inventory_name||"Inventory")+' · '+esc(o.barcode)+'</div></div><span class="pill">Qty '+Number(o.quantity)+'</span></div><div class="detail">'+(href?'<a class="link" href="'+esc(href)+'" target="_blank">Product link ↗</a>':'')+'<br>Supplier website: '+(o.website_url?'<a href="'+esc(o.website_url)+'" target="_blank">'+esc(host(o.website_url))+' ↗</a>':'Unknown')+'<br>Supplier phone: '+esc(o.supplier_phone||"Unknown")+'<br>Supplier email: '+esc(o.supplier_email||"Unknown")+'</div>'+(withSelect?'<div class="card-actions"><button class="secondary" data-delete-order="'+Number(o.id)+'">Delete order</button></div>':'')+'</article>'}
function render(){ $("locked").classList.add("hidden");$("appContent").classList.remove("hidden");tabs();const summary=rules.filter(r=>r.needs_reorder).length;$("summary").classList.toggle("good",!summary);$("summary").textContent=summary?summary+" item"+(summary===1?" needs":"s need")+" reordering":"Everything is above its reorder threshold.";let list=[];if(view==="needed")list=rules.filter(r=>r.needs_reorder);if(view==="all")list=rules;if(view==="ordered")list=orders.filter(o=>o.status==="ordered");if(view==="received")list=orders.filter(o=>o.status==="received");let html="";if(view==="ordered"){html='<div class="card" style="grid-column:1/-1"><label><input type="checkbox" id="selectAll" style="width:auto"> Select all awaiting orders</label><button id="receiveSelected" style="margin-left:12px">Mark selected received</button></div>'}if(view==="received"&&list.length)html='<div class="card" style="grid-column:1/-1"><strong>Received stock starts in Holding.</strong> Assign any amount to a destination; unassigned units stay in Holding until you place them.</div>';if(!list.length){html+='<div class="empty">'+(view==="needed"?'No items need reordering right now.':view==="ordered"?'No orders are awaiting receipt.':view==="received"?'No received stock is waiting for a destination.':'No reorder rules saved yet.')+'</div>'}else if(view==="needed"||view==="all"){html+=list.map(ruleCard).join("")}else if(view==="ordered"){html+=list.map(o=>orderCard(o,true)).join("")}else{html+=list.map(o=>assignmentCard(o)).join("")};$("content").innerHTML=html;if(view==="ordered")ReorderCosts.enhanceOrders(orders,load);$("content").querySelectorAll("[data-order]").forEach(b=>b.onclick=()=>markOrdered(b.dataset.order));$("content").querySelectorAll("[data-expand]").forEach(b=>b.onclick=()=>{expand=String(expand)===b.dataset.expand?null:b.dataset.expand;render()});$("content").querySelectorAll("[data-remove-row]").forEach(b=>b.onclick=()=>{b.closest(".alloc-row").remove();syncRows(b.closest(".allocations"))});$("content").querySelectorAll("[data-add-row]").forEach(b=>b.onclick=()=>addAllocRow(b.closest(".card").querySelector(".allocations")));$("content").querySelectorAll("[data-assign]").forEach(b=>b.onclick=()=>assign(b.dataset.assign,b.closest(".card")));$("content").querySelectorAll("[data-delete-order]").forEach(b=>b.onclick=()=>deleteOrderedOrder(b.dataset.deleteOrder,b));$("content").querySelectorAll("[data-delete-rule]").forEach(b=>b.onclick=()=>deleteReorderRule(b.dataset.deleteRule,b));if($("selectAll"))$("selectAll").onchange=e=>document.querySelectorAll("[data-order-select]").forEach(c=>c.checked=e.target.checked);if($("receiveSelected"))$("receiveSelected").onclick=openReceiveConfirm;$("status").textContent=list.length+" record"+(list.length===1?"":"s")+" shown.";document.dispatchEvent(new CustomEvent("inventoryos-reorders-rendered",{detail:{view}}))}
function assignmentCard(o){const rem=Math.max(0,Number(o.quantity)-Number(o.assigned_qty));return '<article class="card" data-order-card="'+o.id+'"><div class="cardhead"><div><div class="name">'+esc(o.item_name)+'</div><div class="hint">Barcode '+esc(o.barcode)+' · Ordered '+Number(o.quantity)+' · Remaining '+rem+'</div></div><span class="pill">Holding '+rem+'</span></div><div class="card-actions"><button class="secondary" data-mobile="'+o.id+'">Mobile print labels</button><button class="secondary" data-qz="'+o.id+'">Print with QZ Tray</button></div><div class="allocations" data-remaining="'+rem+'" data-barcode="'+esc(o.barcode)+'" data-name="'+esc(o.item_name)+'"></div><div class="card-actions"><button data-add-row="">Add destination</button><button data-assign="'+o.id+'">Confirm assigned locations</button></div><div class="hint">Only the quantities you assign move to their selected locations. The rest remains in Holding.</div></article>'}
function addAllocRow(box){const rem=Number(box.dataset.remaining),opts=destinations.filter(d=>String(d.inventory_id)===String((orders.find(o=>String(o.id)===box.closest("[data-order-card]").dataset.orderCard)||{}).inventory_id));const choices=opts.map(d=>'<option value="'+esc(d.id)+'">'+esc(d.box_name)+(d.location_name&&d.location_name!==d.box_name?' · '+esc(d.location_name):'')+'</option>').join("");const row=document.createElement("div");row.className="alloc-row";row.innerHTML='<input type="number" min="1" max="'+rem+'" value="'+(rem||1)+'" aria-label="Quantity to assign"><select aria-label="Destination"><option value="">Choose destination</option>'+choices+'</select><button class="secondary" data-remove-row="">Remove</button>';box.appendChild(row);syncRows(box)}function syncRows(box){let left=Number(box.dataset.remaining);box.querySelectorAll(".alloc-row input").forEach(input=>{input.max=left;if(Number(input.value)>left)input.value=left;left-=Number(input.value)||0;input.oninput=()=>syncRows(box)})}
async function markOrdered(ruleId){const r=rules.find(x=>String(x.id)===String(ruleId));if(!r)return;const d=await req("/reorder/orders",{method:"POST",body:JSON.stringify({rule_id:Number(ruleId)})});if(!d.success){$("status").textContent=d.error||"Could not save order";return}$("status").textContent="Marked ordered.";view="ordered";await load()}
async function deleteOrderedOrder(orderId,button){const order=orders.find(o=>String(o.id)===String(orderId)&&o.status==="ordered");if(!order){$("status").textContent="This order is no longer awaiting receipt.";return}if(!window.confirm(`Delete the order for ${order.item_name} (qty ${order.quantity})? If stock is still low, it will return to Needs reordering.`))return;button.disabled=true;try{const d=await req("/reorder/orders/"+encodeURIComponent(orderId),{method:"DELETE"});if(!d.success){$("status").textContent=d.error||"Could not delete order";return}await load();$("status").textContent=d.message||"Order deleted."}catch(error){$("status").textContent=error.message||"Could not delete order"}finally{button.disabled=false}}
async function deleteReorderRule(ruleId,button){const rule=rules.find(r=>String(r.id)===String(ruleId));if(!rule)return;if(rule.has_open_order){$("status").textContent="Finish or delete the open order before deleting this rule.";return}if(!window.confirm(`Delete the reorder rule for ${rule.item_name}? Past completed order records for this rule will also be removed. Your stock and product will stay in place.`))return;button.disabled=true;try{const d=await req("/reorder/"+encodeURIComponent(ruleId),{method:"DELETE"});if(!d.success){$("status").textContent=d.error||"Could not delete rule";return}await load();$("status").textContent="Reorder rule deleted. Stock was not changed."}catch(error){$("status").textContent=error.message||"Could not delete rule"}finally{button.disabled=false}}
function openReceiveConfirm(){receiveIds=[...document.querySelectorAll("[data-order-select]:checked")].map(c=>Number(c.dataset.orderSelect));if(!receiveIds.length){$("status").textContent="Select at least one order to receive.";return}const selected=orders.filter(o=>receiveIds.includes(Number(o.id)));$("receiveList").innerHTML=ReorderCosts.receiveList(selected);ReorderCosts.bindReceive(selected);$("confirmModal").classList.remove("hidden")}
$("confirmReceive").onclick=async()=>{const b=$("confirmReceive");try{const order_costs=ReorderCosts.receiveCosts(orders,receiveIds);b.disabled=true;$("receiveCostError").textContent="Receiving stock and creating expenses…";const d=await req("/reorder/orders/receive",{method:"POST",body:JSON.stringify({order_ids:receiveIds,order_costs})});if(!d.success)throw new Error(d.error||"Could not receive orders");$("confirmModal").classList.add("hidden");view="received";await load();$("status").innerHTML='Received stock was added to Holding and expenses were created. <a href="expenses.html">Open Expenses to attach receipts</a>.'}catch(error){$("receiveCostError").textContent=error.message||"Could not receive orders"}finally{b.disabled=false}};$("cancelReceive").onclick=()=>$("confirmModal").classList.add("hidden");
async function assign(orderId,card){const box=card.querySelector(".allocations"),allocations=[...box.querySelectorAll(".alloc-row")].map(row=>({quantity:Number(row.querySelector("input").value),box_id:row.querySelector("select").value}));if(!allocations.length||allocations.some(a=>!a.box_id||!Number.isInteger(a.quantity)||a.quantity<1)){$("status").textContent="Add a valid quantity and destination for each row.";return}const d=await req("/reorder/orders/assign",{method:"POST",body:JSON.stringify({order_id:Number(orderId),allocations})});if(!d.success){$("status").textContent=d.error||"Could not assign stock";return}$("status").textContent=d.unassigned_qty?d.unassigned_qty+" unit(s) remain in Holding.":"All received units have been assigned.";await load()}
async function labelWindow(o){try{if(typeof JsBarcode==="undefined"||!window.jspdf?.jsPDF)throw new Error("Mobile label tools did not load. Check your internet connection and try again.");const qty=Math.max(1,Number(o.quantity));const pdf=new window.jspdf.jsPDF({orientation:"landscape",unit:"in",format:[2,1],compress:true});for(let i=0;i<qty;i++){if(i)pdf.addPage([2,1],"landscape");pdf.setTextColor(0);pdf.setFont("helvetica","bold");pdf.setFontSize(7);pdf.text(String(o.item_name||"").slice(0,55),1,.12,{align:"center",maxWidth:1.85});const canvas=document.createElement("canvas");JsBarcode(canvas,String(o.barcode),{format:"CODE128",displayValue:false,width:2,height:70,margin:0});pdf.addImage(canvas.toDataURL("image/png"),"PNG",.12,.22,1.76,.56);pdf.setFontSize(7);pdf.text(String(o.barcode),1,.88,{align:"center"})}const blob=pdf.output("blob"),name="InventoryOS-labels-"+String(o.barcode||"items").replace(/[^A-Za-z0-9_-]/g,"_")+".pdf",file=new File([blob],name,{type:"application/pdf"}),shareData={title:"InventoryOS product labels",text:"2 × 1 inch barcode labels",files:[file]};if(navigator.share&&(!navigator.canShare||navigator.canShare(shareData))){await navigator.share(shareData);$("status").textContent="Choose your label printing app to print the PDF.";return}const url=URL.createObjectURL(blob);const tab=window.open(url,"_blank");if(!tab){const a=document.createElement("a");a.href=url;a.download=name;a.click()}setTimeout(()=>URL.revokeObjectURL(url),60000);$("status").textContent="Product label PDF is ready. Open or share it with your mobile label printing app."}catch(error){$("status").textContent=error.message||"Could not prepare mobile labels."}}
