<!DOCTYPE html>
<html lang="en">
<head><script src="/js/security-session.js?v=1"></script><script src="/js/security-events.js?v=1"></script>
<meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d0d0d">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Barcode Printing</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
html{touch-action:manipulation;}
*{box-sizing:border-box;}

body{
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top left, rgba(32,201,151,0.16), transparent 35%),
        radial-gradient(circle at top right, rgba(23,162,184,0.10), transparent 35%),
        #0d0d0d;
    color:white;
    padding:18px;
    margin:0;
    overflow-x:hidden;
}

.page{
    max-width:950px;
    margin:0 auto;
}

.panel{
    background:linear-gradient(180deg,#1d1d1d,#151515);
    border:1px solid rgba(255,255,255,0.08);
    padding:24px;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
}

h1{
    text-align:center;
    font-size:34px;
    margin:12px 0 6px 0;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin:0 0 24px 0;
    font-size:15px;
}

.tab-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
    margin-bottom:18px;
}

.tab-button{
    background:linear-gradient(135deg,#242424,#191919);
    border:1px solid rgba(255,255,255,0.10);
    color:white;
    padding:13px;
    border-radius:14px;
    font-weight:bold;
    cursor:pointer;
}

.tab-button.active{
    background:linear-gradient(135deg,var(--accent,#45d36a),rgba(var(--accent-rgb,69,211,106),.72));
    border-color:rgba(var(--accent-rgb,69,211,106),.55);
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.form-card{
    background:linear-gradient(145deg,#242424,#191919);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:18px;
    margin-bottom:16px;
}

.input-label{
    text-align:left;
    color:#ddd;
    font-weight:bold;
    margin:14px 0 6px 2px;
    font-size:14px;
}

input,
select,
button{
    width:100%;
    padding:14px;
    margin:6px 0 12px 0;
    border:none;
    border-radius:12px;
    font-size:16px;
}

input,
select{
    background:#2a2a2a;
    color:white;
    outline:none;
    border:1px solid rgba(255,255,255,0.08);
}

button{
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.print-button{
    background:linear-gradient(135deg,#20c997,#138f6d);
    border:1px solid rgba(32,201,151,0.45);
}

.search-button{
    background:linear-gradient(135deg,#0275d8,#025aa5);
    border:1px solid rgba(0,123,255,0.45);
}

.range-button{
    background:linear-gradient(135deg,#6f42c1,#56329b);
    border:1px solid rgba(111,66,193,0.45);
}

.box-button{
    background:linear-gradient(135deg,#17a2b8,#117a8b);
    border:1px solid rgba(23,162,184,0.45);
}

.clear-button{
    background:linear-gradient(135deg,#333,#222);
    border:1px solid rgba(255,255,255,0.10);
}

.result-grid,
.preview-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px;
    margin-top:14px;
}

.result-card{
    background:linear-gradient(145deg,#242424,#191919);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:16px;
    text-align:left;
}

.result-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:999px;
    font-size:13px;
    font-weight:bold;
    margin-right:6px;
    margin-bottom:8px;
}

.barcode-badge{
    background:#0275d8;
}

.qty-badge{
    background:#6f42c1;
}

.preview-label{
    background:white;
    color:black;
    border-radius:10px;
    padding:8px;
    text-align:center;
    font-weight:bold;
    font-size:13px;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
    margin-top:12px;
}

.summary-card{
    background:#111;
    border:1px solid rgba(255,255,255,0.06);
    border-radius:14px;
    padding:14px;
    text-align:left;
}

.summary-title{
    color:#aaa;
    font-size:13px;
    margin-bottom:6px;
}

.summary-value{
    font-size:22px;
    font-weight:bold;
}

.range-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
}

.empty-state{
    background:linear-gradient(145deg,#242424,#191919);
    border:1px solid rgba(255,255,255,0.08);
    padding:16px;
    border-radius:16px;
    text-align:center;
    color:#ddd;
    margin-top:14px;
}

.link-card{
    display:block;
    text-decoration:none;
    color:white;
    background:linear-gradient(135deg,rgba(0,123,255,0.28),rgba(0,123,255,0.08));
    border:1px solid rgba(0,123,255,0.35);
    padding:14px;
    border-radius:14px;
    font-weight:bold;
    text-align:center;
    margin-top:20px;
}

#printLabels{
    display:none;
}

.print-label{
    background:white;
    width:51mm;
    height:25mm;
    padding:1.5mm;
    box-sizing:border-box;
    text-align:center;
    overflow:hidden;
    page-break-after:always;
    break-after:page;
}

.print-label:last-child{
    page-break-after:auto;
    break-after:auto;
}

.print-label svg{
    width:48mm;
    height:17mm;
    display:block;
    margin:0 auto;
}

.label-text{
    color:black;
    font-weight:bold;
    font-size:11px;
    margin:0;
    padding:0;
    line-height:1;
    text-align:center;
}

#loadingOverlay{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    z-index:9999;
    justify-content:center;
    align-items:center;
}

.loaderBox{
    text-align:center;
    color:white;
    font-weight:bold;
}

.spinner{
    width:55px;
    height:55px;
    border:6px solid #333;
    border-top:6px solid #20c997;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 15px auto;
}

@keyframes spin{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}

@media(max-width:700px){
    h1{font-size:30px;}
    .panel{padding:18px;}
    .range-grid{grid-template-columns:1fr;}
}

@media print{
    @page{
        size:51mm 25mm;
        margin:0;
    }

    html,
    body{
        width:51mm !important;
        min-height:25mm !important;
        margin:0 !important;
        padding:0 !important;
        background:white !important;
        overflow:visible !important;
    }

    body *{
        display:none !important;
    }

    #printLabels,
    #printLabels *{
        display:block !important;
    }

    #printLabels{
        display:block !important;
        width:51mm !important;
        margin:0 !important;
        padding:0 !important;
        background:white !important;
    }

    .print-label{
        display:block !important;
        position:relative !important;
        width:51mm !important;
        height:25mm !important;
        padding:1.5mm !important;
        margin:0 !important;
        box-sizing:border-box !important;
        background:white !important;
        text-align:center !important;
        overflow:hidden !important;
        page-break-after:always !important;
        break-after:page !important;
    }

    .print-label:last-child{
        page-break-after:auto !important;
        break-after:auto !important;
    }

    .print-label svg{
        width:48mm !important;
        height:17mm !important;
        display:block !important;
        margin:0 auto !important;
    }

    .label-text{
        color:black !important;
        font-size:11px !important;
        font-weight:bold !important;
        margin:0 !important;
        padding:0 !important;
        line-height:1 !important;
        text-align:center !important;
    }

    #loadingOverlay{
        display:none !important;
    }
}
</style>
<link rel="stylesheet" href="css/theme.css?v=contrast-1">
<link rel="stylesheet" href="css/inventoryTopbar.css">

<link rel="stylesheet" href="css/appShell.css?v=3">
</head>

<body>

<div class="page">
<div class="panel">

<div id="inventory-topbar"></div>

<h1>Barcode Printing</h1>
<p class="subtitle" id="barcodePrintingSubtitle">Print product labels, box labels, barcode ranges and saved print jobs</p>

<div class="tab-grid">
    <button class="tab-button active" data-ios-click="hafad46000d55b16d">Product Labels</button>
    <button class="tab-button" id="locationLabelsTab" data-ios-click="h754f3a468271fda8">Box Labels</button>
    <button class="tab-button" data-ios-click="hadef0181105d723b">Bulk Range</button>
    <button class="tab-button" data-ios-click="h499d377da2b4a8cf">Print Jobs</button>
    <button class="tab-button" data-ios-click="h4049e30930b0af83">Quick Print</button>
</div>

<div id="productSection" class="section active">
    <div class="form-card">
        <div class="input-label">Live Product Search</div>
        <input type="text" id="productSearch" placeholder="Start typing product name or barcode">
        <div id="productResults"></div>
    </div>
</div>

<div id="boxSection" class="section">
    <div class="form-card">
        <div class="input-label" id="selectLocationLabel">Select Box</div>
        <select id="boxSelect">
            <option value="">Loading boxes...</option>
        </select>

        <button class="box-button" id="printLocationLabelButton" data-ios-click="hc4a6a8b494682133">Print Box Label</button>
    </div>
</div>

<div id="rangeSection" class="section">
    <div class="form-card">
        <div class="input-label">Bulk Barcode Range</div>

        <div class="range-grid">
            <div>
                <div class="input-label">Prefix</div>
                <input type="text" id="rangePrefix" value="ITEM-" placeholder="ITEM-">
            </div>

            <div>
                <div class="input-label">Start Number</div>
                <input type="number" id="rangeStart" placeholder="33" min="1">
            </div>

            <div>
                <div class="input-label">End Number</div>
                <input type="number" id="rangeEnd" placeholder="60" min="1">
            </div>
        </div>

        <button class="range-button" data-ios-click="h61dd132f2af7b13c">Generate Range Labels</button>
        <button class="print-button" data-ios-click="h44e2955e4d29d205">Print Generated Labels</button>
        <button class="clear-button" data-ios-click="h61d65e12593becd3">Clear Labels</button>

        <div id="rangePreview" class="empty-state">No range generated yet.</div>
    </div>
</div>

<div id="jobSection" class="section">
    <div class="form-card">
        <div class="input-label">Select Print Job</div>
        <select id="printJobSelect">
            <option value="">Loading print jobs...</option>
        </select>

        <button class="search-button" data-ios-click="h84c28000558f5627">Load Print Job</button>
        <button class="print-button" data-ios-click="h44e2955e4d29d205">Print Loaded Labels</button>
        <button class="clear-button" data-ios-click="h61d65e12593becd3">Clear Loaded Labels</button>
        <button class="clear-button" id="deletePrintJobButton" type="button" data-ios-click="hb7ed65e7fff439d3">Delete Print Job</button>

        <div id="jobSummary"></div>
        <div id="jobPreview"></div>
    </div>
</div>

<div id="quickSection" class="section">
    <div class="form-card">
        <div class="input-label">Quick Barcode Print</div>
        <input type="text" id="quickBarcode" placeholder="Example: ITEM-54 or BOX-1">

        <button class="print-button" data-ios-click="ha570a245452557a1">Print Barcode</button>
    </div>
</div>

<a class="link-card" href="index.html">← Back to Dashboard</a>
<a class="link-card" href="#" data-ios-click="h153fb37bcb72a526">Logout</a>

</div>
</div>

<div id="printLabels"></div>

<div id="loadingOverlay">
    <div class="loaderBox">
        <div class="spinner"></div>
        <p>Working...</p>
    </div>
</div>

<script src="js/theme.js?v=contrast-1"></script>
<script src="/js/onboarding-gate.js?v=1"></script>
<script src="js/api.js?v=manufacturing-1"></script>
<script src="js/inventoryTopbar.js?v=4"></script>
<script src="js/workspace.js?v=5"></script>
<script src="/js/pages/barcodeprinting.1.js?v=security-1"></script>


<script src="js/appShell.js?v=5"></script>
</body>
</html>
